name: Deploy Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Finish each production release before starting the next one.
concurrency:
  group: cloudflare-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SIGNALING_URL: https://baan-toolbox-signaling.kruakemaths.workers.dev
      ALLOWED_ORIGINS: https://baan-toolbox-ake.pages.dev
      PAGES_PROJECT: baan-toolbox-ake
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/worker-build
            ~/.cache/.wasm-pack
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: npm ci
      - name: Unit tests and WASM checks
        run: npm run check
      - name: Build frontend release
        run: npm run build
      - name: Build and validate signaling release
        run: npx wrangler deploy --dry-run --var "ALLOWED_ORIGINS:$ALLOWED_ORIGINS"
      - name: Check deployment credentials
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Set repository secret CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Set repository variable CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - name: Deploy signaling Worker and Durable Object
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --var "ALLOWED_ORIGINS:$ALLOWED_ORIGINS" --message "GitHub $GITHUB_SHA"
      - name: Deploy Pages
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --config wrangler.pages.jsonc --project-name "$PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=false
      - name: Verify public deployment
        if: github.event_name != 'pull_request'
        run: node scripts/verify-deployment.mjs
